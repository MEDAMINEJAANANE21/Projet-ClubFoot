spring:
  application:
    name: clubfoot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clubfoot}
    username: ${DB_USERNAME:clubfoot}
    password: ${DB_PASSWORD:clubfoot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8095}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  jwt:
    # Valeur de développement uniquement : à remplacer par la variable JWT_SECRET (32 caractères minimum).
    secret: ${JWT_SECRET:dev-secret-a-changer-en-production-0123456789}
    expiration: ${JWT_EXPIRATION:PT2H}
    issuer: clubfoot-api
