<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" routerLink="/" aria-label="Wydad AC, accueil">
      <img src="images/logo-wac.png" alt="" width="32" height="39">
      <span class="brand__name">Wydad AC</span>
    </a>

    <nav class="nav" id="main-nav" aria-label="Navigation principale" [class.nav--open]="isMenuOpen()">
      <ul class="nav__list">
        @for (link of links; track link.path) {
          <li>
            <a
              class="nav__link"
              [routerLink]="link.path"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <button class="icon-button cart-button" type="button" [attr.aria-label]="cartLabel()" (click)="cart.open()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 7h12l-1 12.2a1 1 0 0 1-1 .8H8a1 1 0 0 1-1-.8L6 7Z" />
        <path d="M9 7a3 3 0 0 1 6 0" />
      </svg>
      @if (cart.count() > 0) {
        <span class="cart-button__count">{{ cart.count() }}</span>
      }
    </button>

    <button
      class="icon-button nav-toggle"
      type="button"
      aria-controls="main-nav"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        @if (isMenuOpen()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>
</header>
