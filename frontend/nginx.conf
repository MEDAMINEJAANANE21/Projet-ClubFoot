server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les fichiers JS et CSS ont un nom haché par Angular : ils peuvent être mis en cache longtemps.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue renvoie index.html, le routeur Angular prend le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
