<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhésion</title>
    <link rel="stylesheet" href="Styleinscription.css" >
    <link rel="preconnect" href="https://fonts.googleapis.com"><!--Préconnexion au serveur de Google Fonts pour accélérer le chargement des polices-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><!--Préconnexion au serveur "fonts.gstatic.com" de Google Fonts avec gestion des requêtes cross-origin-->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--Importer les polices "Barlow" et "Work Sans" depuis Google Fonts avec une gamme complète de poids et styles-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--Lier une feuille de style CSS pour les icônes Font Awesome depuis un CDN, avec vérification d'intégrité et gestion des requêtes cross-origin-->
</head>
<body>
    <div class="formulaire">
        <div class="ff"></div><br><!--Début et fin d'une division avec la classe "ff" (vide), suivi d'un saut de ligne-->
            <form><!--Début du formulaire-->
                <h1>Adhésion au Wydad AC</h1>
                <div class="form1">
                    <label for="nomcomplet">Nom Complet<span class="star"></span></label><br>
                    <!--Étiquette pour le champ de saisie du nom complet, avec une icône d'étoile (span class="star") et un saut de ligne-->
                    <input type="text" placeholder="Votre Nom" required 
                    class="input" id="nomcomplet"><br><br>
                     <!--Champ de saisie pour le nom complet avec un texte d'indication "Votre Nom", obligatoire (required), avec la classe "input" et l'identifiant "nomcomplet", suivi de deux sauts de ligne-->
                     
                    <label for="adresse">Adresse<span class="star"></span></label><br>
                    <input type="text" placeholder="Votre Adresse"
                    required class="input" id="adresse"><br><br>

                    <label for="tel">Télephone<span class="star"></span></label><br>
                    <input type="text" placeholder="Votre Télephone"
                    required class="input" id="tel"><br><br>

                    <label for="age">Age<span class="star"></span></label><br>
                    <input type="number" placeholder="Votre Age"
                    required class="input" id="age"><br><br>

                    <label for="mail">E-mail<span class="star"></span></label><br>
                    <input type="text" placeholder="Votre Adresse E-mail"
                    required class="input" id="mail"><br><br>

                   

                </div>

                <div class="form2">
                    <label for="pays">Pays<span class="star"></span></label>
                    <select id="pays" class="input">
                        <option>Maroc</option>
                        <option>Tunisie</option>
                        <option>Egypte</option>
                        <option>Afrique Du Sud</option>
                        <option>Libye</option>
                        <option>Sénegal</option>
                        <option>Cote D'Ivoire</option>
                        <option>Mauritanie</option>
                        <option>Nigeria</option>
                        <option>France</option>
                        <option>Allemagne</option>
                        <option>Espagne</option>
                        <option>Italie</option>
                        <option>Portugal</option>
                        <option>Russie</option>
                        <option>Angleterre</option>
                        <option>Suisse</option>
                        <option>Canada</option>
                        <option>Etats Unis</option>
                        <option>Brésil</option>
                        <option>Argentine</option>
                        <option>Colombie</option>
                    
                    </select><br><br>
                    <label for="date">Date<span class="star"></span></label><br>
                    <input type="date" class="input" id="date"><br><br>

                    <label for="sexe">Sexe<span class="star"></span></label><br>
                    Homme<input type="radio" name="sexe" checked>&nbsp;
                    Femme<input type="radio" name="sexe" checked>&nbsp;<br><br>
                    
                    <label for="sexe">Pièces d'identifications<span class="star"></span></label><br>
                    Actes de naissances<input type="checkbox">&nbsp;
                    Photos<input type="checkbox">&nbsp;
                    CIN<input type="checkbox">&nbsp;
                   
                    

                </div>
                <div class="button">
                <input type="submit" value="Envoyer">
            </div>
        </form>
           
    </div>
    <footer>
        <p>Porter le maillot du Wydad est un honneur<br> Le mouiller est un devoir !</p>
    </footer>

  
</body>
</html>
